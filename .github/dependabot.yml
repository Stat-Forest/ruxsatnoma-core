# Dependabot version updates. Read automatically once on the default branch.
version: 2
updates:
  # === Python dependencies declared in pyproject.toml ===
  # The `pip` ecosystem reads PEP 621 dependencies directly; no lock file
  # is required, which is why this project does not need one.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Minor and patch bumps arrive as one weekly PR; majors open
      # individually so they get a deliberate review.
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # === GitHub Actions pinned in .github/workflows ===
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
