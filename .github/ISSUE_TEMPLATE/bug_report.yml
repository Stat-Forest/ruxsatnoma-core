name: Bug report
description: Create a report to help us improve Ruxsatnoma
title: "[BUG]"
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        **Please write all information in English.**
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide a step-by-step process to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: screenshots-code
    attributes:
      label: Screenshots/Code snippets
      description: If applicable, add screenshots or code snippets to help explain your problem.
    validations:
      required: false
  - type: input
    id: service-version
    attributes:
      label: Service Version
      description: What version of ruxsatnoma-core are you using? (Check pyproject.toml or the API /health endpoint)
      placeholder: "e.g., 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: What environment were you running Ruxsatnoma in?
      options:
        - Production
        - Development
        - Staging
        - Local/Docker
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include relevant information, logs, error messages, or stack traces. These can be screenshots or code snippets.
      placeholder: |
        Paste error logs, stack traces, or relevant code snippets here.
        For logs, include timestamps and context around the error.
    validations:
      required: true
  - type: textarea
    id: possible-solution
    attributes:
      label: Possible Solution
      description: Have a solution in mind? Please suggest it here, or write "None".
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here (e.g., environment variables, configuration, related issues).
    validations:
      required: false
