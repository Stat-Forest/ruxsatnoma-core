name: CI

# Runs the gate on pull requests only. The previous `on: [push, pull_request]`
# fired twice for every push to a branch with an open PR: once for the push,
# once for the PR's synchronize event.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Nine checks
    uses: ./.github/workflows/checks.yml
