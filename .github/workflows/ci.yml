name: CI

on:
  # `main` only — every other branch is already covered without a push trigger, and adding
  # one back means running the same commit twice:
  #   * a feature branch is covered by `pull_request` (listing every branch here ran CI twice
  #     on each push to a branch with an open PR — 42 of the 49 duplicated commits in the
  #     first week of September were that pair);
  #   * `dev` is covered by deploy.yml's `Gate` job, which calls this workflow through
  #     `workflow_call` and blocks the deploy when it fails. A push trigger here ran `lint`
  #     and `test` a second time on every merge commit.
  # `main` has no deploy and therefore no gate, so it keeps its push run.
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  # A superseded PR run has nothing left to prove, so cancel it. Push and workflow_call runs
  # are never cancelled: the `workflow_call` one is deploy.yml's gate, and cancelling that
  # would let an unverified commit reach the server.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - run: uv sync --frozen
      # Cheap and DB-free — fails fast when two branches each added a revision.
      - run: make heads
      # Structure and size budget of .claude/lessons.md — also cheap and DB-free.
      - run: make lessons-check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # bandit, MEDIUM+ only; same args as the Makefile and the pre-commit hook.
      - run: make security

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ruxsatnoma
          POSTGRES_PASSWORD: ruxsatnoma
          POSTGRES_DB: ruxsatnoma
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ruxsatnoma"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - run: uv sync --frozen
      # MinIO can't be a `services:` entry (needs a command); run it directly.
      - run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ruxsatnoma -e MINIO_ROOT_PASSWORD=ruxsatnoma-secret \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
      # postgresql-client creates the test DB below. The three pango/harfbuzz packages are
      # WeasyPrint's own documented Debian/Ubuntu requirement (they carry gobject, pango,
      # pangoft2, harfbuzz and fontconfig, which it dlopens at import time): without them
      # `import weasyprint` raises and the whole job dies at collection, not at a test.
      # libharfbuzz-subset0 is nominally optional — WeasyPrint falls back to fontTools for
      # subsetting — but the fallback embeds DIFFERENT font bytes, so leaving it out would
      # make CI's PDFs disagree with a developer's for no visible reason (3.11a ruling 3).
      - run: |
          sudo apt-get update && sudo apt-get install -y \
            postgresql-client libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: |
          PGPASSWORD=ruxsatnoma psql -h localhost -U ruxsatnoma -d ruxsatnoma \
            -c "CREATE DATABASE ruxsatnoma_test OWNER ruxsatnoma"
          PGPASSWORD=ruxsatnoma psql -h localhost -U ruxsatnoma -d ruxsatnoma_test \
            -c "CREATE EXTENSION IF NOT EXISTS postgis"
      # -n 4 mirrors `make test`. Each worker migrates a database of its own,
      # named after DATABASE_URL_TEST (tests/conftest.py) and created on the
      # spot -- the CREATE DATABASE above covers only a serial run. No
      # --fresh-db here: the `services:` postgres is new for every job.
      - run: uv run pytest -q -n 4
        env:
          WORKERS_MODE: 'off'
