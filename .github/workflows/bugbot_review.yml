name: Bugbot Review

# Asks Cursor's bugbot to review every new pull request.
#
# Required repo secret:
#   CURSOR_REVIEW_TOKEN — the token the comment is posted as. Without it the
#   step fails with a 401 on every opened PR: GITHUB_TOKEN cannot be used
#   here, because a comment it posts never re-triggers another workflow.

on:
  pull_request:
    types: [opened]

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - name: Post @bugbot review comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.CURSOR_REVIEW_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "@bugbot review",
            });
