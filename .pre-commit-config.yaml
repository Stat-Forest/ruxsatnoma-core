repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      # A committed key cannot be un-committed — it can only be rotated.
      - id: detect-private-key
      # Stage work goes on a feat branch and reaches main through a PR (as 3.1-3.4 did).
      # Both long-lived branches (decision #47): work lands on dev by PR,
      # main only ever receives dev through a release PR.
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "dev"]

  # Security linter. Kept out of pyproject.toml — pre-commit builds its own env,
  # and the Makefile/CI run it through uvx. -ll = MEDIUM+ only; B101 (assert) skipped.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-ll", "--skip", "B101"]
        exclude: ^(tests|migrations)/

  - repo: local
    hooks:
      # Two branches adding a revision on the same parent are green in isolation
      # and only collide after both merge. No DB needed — reads versions/ only.
      - id: alembic-single-head
        name: alembic single head
        entry: make heads
        language: system
        pass_filenames: false
        files: ^migrations/versions/

      # lessons.md is read before every task, so its size is a cost every session
      # pays. Prose cannot hold a budget; this fails on a malformed or overlong entry.
      - id: lessons-check
        name: lessons.md structure and size
        entry: make lessons-check
        language: system
        pass_filenames: false
        files: ^(\.claude/lessons\.md|scripts/lessons_check\.py)$

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
