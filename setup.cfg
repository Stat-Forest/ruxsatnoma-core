# Module boundaries of core, checked by import-linter.
#
# The rules themselves are stated in architecture/modules.md; this file is
# their executable form. Rules that hold only by discipline break in the third
# week, so every one of them is checked in CI: lint-imports.

[importlinter]
root_package = core

[importlinter:contract:layers]
name = Layers
type = layers
layers =
    core.main
    core.api : core.worker
    core.modules
    core.shared
    core.db
    core.config

[importlinter:contract:shared-is-independent]
name = Rule 3: shared depends on no domain module
type = forbidden
source_modules =
    core.shared
forbidden_modules =
    core.modules

[importlinter:contract:iam-internals]
name = Rule 2: only core.modules.iam itself may reach inside iam
type = forbidden
source_modules =
    core.main
    core.api
    core.shared
    core.modules.geo
    core.modules.rules
    core.modules.application
    core.modules.permit
    core.modules.signature
    core.modules.payment
    core.modules.inspection
    core.modules.reporting
    core.modules.archive
    core.modules.prosecutor
forbidden_modules =
    core.modules.iam.**

