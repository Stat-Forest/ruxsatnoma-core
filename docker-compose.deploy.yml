# docker-compose.deploy.yml
# The dev-server stack. Every secret comes from .env, which lives ONLY on the server and is
# never in git; a missing one fails the deploy (`:?`) instead of starting insecurely.
# No port is published to the host — Caddy reaches the api over the shared edge network.
#
# Bring up:  docker compose -f docker-compose.deploy.yml up -d
# Migrate:   docker compose -f docker-compose.deploy.yml run --rm api alembic upgrade head
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
    volumes:
      - miniodata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # e-imzo-server v2.1.1 (plan 05.2, task 8; deploy/eimzo/README.md). NOT on the
  # `edge` network: nothing outside the stack may reach it (R2) -- no port is
  # published here either, unlike `db`/`minio` in docker-compose.yml, since even
  # localhost-on-the-server access is more than R2 asks for. Check it from inside
  # the stack instead: `docker compose exec api curl http://eimzo:8080/ping`.
  #
  # `profiles: ["eimzo"]` (Critical 1, final review) -- same reasoning as
  # `docker-compose.yml`'s own copy of this comment: `deploy/eimzo/dist/` is
  # gitignored and, today, exists on no server either (task 12 blocked on
  # NIC). `.github/workflows/deploy.yml` activates this profile itself, via
  # `COMPOSE_PROFILES=eimzo`, ONLY once it finds `deploy/eimzo/dist/
  # e-imzo-server.jar` already placed on the server by an operator -- so a
  # bare `$COMPOSE build`/`up -d` (this file's own default, unprofiled
  # commands above) never fails on the missing jar, and the day the jar
  # exists, the very next deploy builds and starts this service with no
  # further change needed here. `api`'s `depends_on.eimzo` below carries
  # `required: false` for the same reason: a non-profiled service `depends_
  # on` an excluded profiled one is otherwise an INVALID compose project
  # (`docker compose config` refuses to even load), not merely a skipped
  # service -- verified empirically (`.superpowers/sdd/05.2-eimzo-real/final-fix-report.md`).
  eimzo:
    image: ruxsatnoma-eimzo:2.1.1
    profiles: ["eimzo"]
    build:
      context: ./deploy/eimzo
    restart: unless-stopped
    networks: [default]
    environment:
      EIMZO_VPN_HOST: ${EIMZO_VPN_HOST:-}
      EIMZO_VPN_PORT: ${EIMZO_VPN_PORT:-}
      EIMZO_VPN_KEY_PASSWORD: ${EIMZO_VPN_KEY_PASSWORD:-}
    volumes:
      - ./deploy/eimzo/keys:/opt/e-imzo-server/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: ruxsatnoma-api:latest
    # The bucket is created by ensure_bucket() in the app lifespan — nothing to do here.
    # app/main.py exposes create_app() only, no module-level `app` — --factory matches
    # the image's own CMD (deploy/Dockerfile) and the project's dev command (Makefile).
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      # Both hops of the chain visitor -> gateway (192.168.0.244) -> Caddy (172.28.0.2) -> api
      # must be listed. uvicorn 0.52.4's X-Forwarded-For parser walks the header IN REVERSE
      # and returns the first entry NOT in this trusted set. Caddy's reverse_proxy appends its
      # own peer (the gateway) to XFF, so the header uvicorn sees is "<visitor>, 192.168.0.244".
      # Trusting only 172.28.0.2 (the TCP peer that gates the middleware at all) leaves
      # 192.168.0.244 untrusted, so THAT becomes the attributed client — which is exactly the
      # bug that put the gateway's IP into every audit_log row and collapsed the public QR
      # route's rate limit into one shared bucket for the whole country. Adding 192.168.0.244
      # tells uvicorn to skip over it too and keep walking left to the real visitor.
      # This stays unspoofable: a client-supplied XFF value is always inserted to the LEFT of
      # the gateway's own appended entry, so the reverse walk can never reach it before it has
      # already matched a trusted hop and kept going — a wildcard, not this exact pair, is what
      # would let a client spoof it.
      - --forwarded-allow-ips
      - 172.28.0.2,192.168.0.244
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      # `service_started`, NOT `service_healthy` (fix round 1, finding 6) --
      # measured directly, with no VPN key present (the state until NIC
      # delivers, see deploy/eimzo/README.md): e-imzo-server never binds port
      # 8080 at all (`HandlerRegistry.register` throws a Guice
      # `ProvisionException` on the missing `keys/client.key` before the HTTP
      # listener starts), so its healthcheck can never pass and the container
      # sits `unhealthy` forever. `service_healthy` here would therefore block
      # `api` from starting AT ALL for as long as the key is missing or the
      # provider is down -- turning a provider outage into a total outage for
      # every citizen-facing feature, including ones that never touch E-IMZO.
      # `service_started` only waits for the eimzo container to exist and be
      # running (so its DNS name resolves) and lets `api` come up regardless;
      # the two proxy routes that actually call it
      # (`app/modules/integrations/router.py`, task 7) already turn a provider
      # outage into `ERR-INT-001`/`ERR-INT-002` (503/502) rather than a crash,
      # so a down E-IMZO server costs only signing and login-via-E-IMZO, never
      # the whole system. `required: false` (Critical 1, final review): with
      # the `eimzo` service now behind a profile (its own comment above),
      # this dependency must not be REQUIRED, or `docker compose config`
      # refuses to load this file at all whenever that profile is not
      # active -- turning "the jar is missing" into "nothing in this file
      # works", worse than the eimzo-only outage this comment already
      # accepts. With the profile active, `required: false` changes nothing:
      # `condition: service_started` still applies exactly as before.
      eimzo:
        condition: service_started
        required: false
    networks:
      # `default` is this stack's private network: db, minio and eimzo are reachable only here.
      default:
      edge:
        aliases: [api]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  miniodata:

networks:
  # `default` is this stack's private network: db and minio are reachable only from api.
  edge:
    external: true
    name: ruxsatnoma-edge
