[project]
name = "ruxsatnoma-backend"
version = "0.1.0"
description = "Ruxsatnoma-urmon — electronic permits for the use of forest fund lands"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "uuid-utils>=0.9",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=43",
    "email-validator>=2",
    "aioboto3>=15.5.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pyright>=1.1.411",
    "types-aiobotocore-s3>=3.9.0",
]

[tool.pyright]
# Standard mode to start (decision #39); tighten per-module as the code grows.
typeCheckingMode = "standard"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["app", "tests", "migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# Depends(...) as a default value is FastAPI's idiomatic DI pattern, not a bug (B008)
extend-immutable-calls = ["fastapi.Depends"]
