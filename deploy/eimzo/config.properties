# e-imzo-server v2.1.1 configuration (plan 05.2, task 8).
#
# `${...}` placeholders are resolved from the container's own environment at
# startup (docker-compose.yml / docker-compose.deploy.yml's `eimzo` service,
# sourced from .env) -- never hard-coded here.

listen.ip=0.0.0.0
listen.port=8080

# `local` or `redis` -- the jar's own two options (verified against the vendor's
# v2.1.1 distribution, 2026-05-25). Redis is required only for SEVERAL app
# servers sharing one e-imzo-server, or for the vendor's mobile API; decision
# #36 rejected Redis for this project, and today's stack runs one API
# container. Should that ever change to more than one, THIS line -- and only
# this line -- is what changes.
cache.type=local

vpn.tls.enabled=yes
vpn.connect.host=${EIMZO_VPN_HOST}
vpn.connect.port=${EIMZO_VPN_PORT}
vpn.key.file.path=keys/client.key
vpn.key.password=${EIMZO_VPN_KEY_PASSWORD}
vpn.truststore.file.path=keys/vpn.jks
tsp.jks.file.path=keys/truststore.jks

metrics.server.enabled=true
metrics.server.listen.port=8081
