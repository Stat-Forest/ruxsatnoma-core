services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ruxsatnoma
      POSTGRES_PASSWORD: ruxsatnoma
      POSTGRES_DB: ruxsatnoma
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./pg-data:/var/lib/postgresql/data
      # монтируем ОДИН файл, не каталог: bind-mount каталога затёр бы
      # собственные init-скрипты образа postgis (они ставят расширение в основную БД)
      - ./docker/initdb/01-test-db.sql:/docker-entrypoint-initdb.d/99-test-db.sql:ro
      # 98- runs after the image's 10_postgis.sh: drop its unused tiger/topology
      # extras so dev-DB autogenerate stays clean (see the SQL file's comment)
      - ./docker/initdb/02-drop-image-extras.sql:/docker-entrypoint-initdb.d/98-drop-image-extras.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruxsatnoma"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ruxsatnoma
      MINIO_ROOT_PASSWORD: ruxsatnoma-secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["./minio-data:/data"]

  # e-imzo-server v2.1.1 (plan 05.2, task 8; deploy/eimzo/README.md). Must never be
  # reachable from the internet (R2) -- in the deploy stack this stays off the `edge`
  # network entirely; here there is no `edge` network to join in the first place, so
  # `127.0.0.1`-only publishing (the same binding `db`/`minio` above use) is what keeps
  # it local-machine-only for `curl localhost:8080/ping` while developing.
  eimzo:
    image: ruxsatnoma-eimzo:2.1.1
    build:
      context: ./deploy/eimzo
    restart: unless-stopped
    networks: [default]
    environment:
      EIMZO_VPN_HOST: ${EIMZO_VPN_HOST:-}
      EIMZO_VPN_PORT: ${EIMZO_VPN_PORT:-}
      EIMZO_VPN_KEY_PASSWORD: ${EIMZO_VPN_KEY_PASSWORD:-}
    volumes:
      - ./deploy/eimzo/keys:/opt/e-imzo-server/keys:ro
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
