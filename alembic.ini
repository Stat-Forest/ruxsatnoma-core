# Alembic configuration for the core service.
#
# The database URL is deliberately empty here: alembic/env.py takes it from
# core.config, which reads the environment. A caller may still override it,
# which is what the test fixture does with its throwaway container.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Migration file names start with the date and are written in English:
# 2026_09_15_add_application_exclusion_constraint.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(slug)s

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
